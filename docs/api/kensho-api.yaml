    Requirement:
      type: object
      required: [id, title, verifiedOn]
      properties:
        id: { type: string, description: Estable entre alumnos; es el requirementId de la verificación }
        title: { type: string }
        description: { type: string }
        verifiedOn: { type: [string, 'null'], format: date }
    Observation:
      type: object
      required: [id, text, authorName, observedOn]
      properties:
        id: { type: string }
        text: { type: string }
        authorName: { type: string }
        observedOn: { type: string, format: date }
        clipThumbnailUrl: { type: [string, 'null'], format: uri }
    MembershipStatus:
      type: string
      enum: [ACTIVE, PAUSED, INACTIVE]
    StudentRecord:
      type: object
      description: >-
        Ficha editable. `gender` y `contact.phone` pueden ser `null` en alumnos anteriores al alta actual;
        `enrollment.scheduleId` es `null` si su horario se borró mientras estaba de baja. `scheduleOptions` son los
        horarios de su disciplina; `available` cuenta el cupo sin contarlo a él.
      required: [asOf, id, fullName, birthDate, age, membership, enrollment, contact, scheduleOptions]
      properties:
        asOf: { type: string, format: date-time }
        id: { type: string }
        fullName: { type: string, minLength: 1, maxLength: 120 }
        birthDate: { type: string, format: date }
        age: { type: integer, minimum: 0 }
        gender: { type: [string, 'null'], enum: [MALE, FEMALE, null] }
        medicalNotes: { type: [string, 'null'], maxLength: 1000 }
        photoUrl: { type: [string, 'null'], format: uri }
        membership:
          type: object
          required: [status, enrolledOn, changedOn, reason]
          properties:
            status: { $ref: '#/components/schemas/MembershipStatus' }
            enrolledOn: { type: string, format: date }
            changedOn: { type: [string, 'null'], format: date, description: Último cambio de estado }
            reason: { type: [string, 'null'], maxLength: 200 }
        enrollment:
          type: object
          required: [discipline, programName, scheduleId, firstClassOn]
          properties:
            discipline: { $ref: '#/components/schemas/DisciplineCode' }
            programName: { type: string }
            scheduleId: { type: [string, 'null'] }
            firstClassOn: { type: [string, 'null'], format: date }
        guardian:
          type: [object, 'null']
          required: [name, relation]
          properties:
            name: { type: string }
            relation: { type: string, enum: [FATHER, MOTHER, LEGAL_GUARDIAN] }
        contact:
          type: object
          properties:
            phone: { type: [string, 'null'], pattern: '^\+[1-9][0-9]{7,14}$' }
            email: { type: [string, 'null'], format: email }
        emergencyContact:
          type: [object, 'null']
          required: [name, phone]
          properties:
            name: { type: string }
            phone: { type: string }
        scheduleOptions:
          type: array
          items:
            type: object
            required: [id, weekdays, startsAt, endsAt, description, available]
            properties:
              id: { type: string }
              weekdays:
                type: array
                items: { type: string, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY] }
              startsAt: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }
              endsAt: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }
              description: { type: [string, 'null'] }
              available: { type: boolean }
    StudentRecordPatch:
      type: object
      description: >-
        Solo las llaves que cambian; `null` borra los opcionales. `contact` va completo (si falta `email`, se borra).
        `scheduleId` debe ser de su disciplina y con cupo (sin contarlo a él).
      properties:
        fullName: { type: string, minLength: 1, maxLength: 120 }
        birthDate: { type: string, format: date }
        gender: { type: string, enum: [MALE, FEMALE] }
        medicalNotes: { type: [string, 'null'], maxLength: 1000 }
        guardian:
          type: [object, 'null']
          required: [name, relation]
          properties:
            name: { type: string, minLength: 1, maxLength: 120 }
            relation: { type: string, enum: [FATHER, MOTHER, LEGAL_GUARDIAN] }
        contact:
          type: object
          required: [phone]
          properties:
            phone: { type: string, pattern: '^\+[1-9][0-9]{7,14}$' }
            email: { type: [string, 'null'], format: email }
        emergencyContact:
          type: [object, 'null']
          required: [name, phone]
          properties:
            name: { type: string }
            phone: { type: string, pattern: '^\+[1-9][0-9]{7,14}$' }
        scheduleId: { type: string }
    MembershipRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/MembershipStatus' }
        reason: { type: string, minLength: 1, maxLength: 200 }
        scheduleId: { type: string, description: Solo al reactivar; con otro estado responde 422 }
        cancelUpcomingEvents: { type: boolean, description: Solo aplica a `PAUSED`; la baja siempre cancela }
    MembershipResponse:
      allOf:
        - $ref: '#/components/schemas/StudentRecord'
        - type: object
          required: [canceledCharges]
          properties:
            canceledCharges: { type: integer, minimum: 0, description: Cargos pendientes de eventos cancelados }
    RegistrationSetup:
      type: object
      required: [asOf, registrationId, phoneCountryCode, disciplines, schedules, plan]
      properties:
        asOf: { type: string, format: date-time }
        registrationId: { type: string }
        phoneCountryCode: { type: string, pattern: '^\+[0-9]{1,3}$' }
        disciplines:
          type: array
          minItems: 1
          items:
            type: object
            required: [code, maxStripes, belts]
            properties:
              code: { $ref: '#/components/schemas/DisciplineCode' }
              maxStripes: { type: integer, minimum: 0, maximum: 10 }
              belts:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [belt, grade]
                  properties:
                    belt: { $ref: '#/components/schemas/BeltCode' }
                    grade: { $ref: '#/components/schemas/BeltGrade' }
        schedules:
