      type: string
      description: Sin marca, `PENDING` mientras la sesión no termina y `ABSENT` después
      enum: [PRESENT, ABSENT, EXCUSED, PENDING]
    AttendanceMarkRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/AttendanceStatus' }
        note: { type: [string, 'null'], maxLength: 200, description: Solo con `EXCUSED` }
    ChargeCategory:
      type: string
      enum: [MONTHLY, ENROLLMENT, EXAM, EVENT]
    ChargeStatus:
      type: string
      enum: [PENDING, OVERDUE, PAID, CANCELED]
    PaymentMethod:
      type: string
      enum: [CASH, CARD, TRANSFER]
    PaymentsSummary:
      type: object
      required: [asOf, month, currency, collectedCents, expectedCents, previousCollectedCents, pendingCents, studentsWithPending, otherCollectedCents]
      properties:
        asOf: { type: string, format: date-time }
        month: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        collectedCents: { type: integer, minimum: 0 }
        expectedCents: { type: integer, minimum: 0 }
        previousCollectedCents: { type: integer, minimum: 0 }
        pendingCents: { type: integer, minimum: 0 }
        studentsWithPending: { type: integer, minimum: 0 }
        otherCollectedCents: { type: integer, minimum: 0 }
        upcomingEvent:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, category, title, date, currency]
              properties:
                id: { type: string }
                category: { type: string, enum: [EXAM, EVENT] }
                title: { type: string }
                date: { type: string, format: date }
                venue: { type: [string, 'null'] }
                currency: { type: string }
                amountCents: { type: integer, minimum: 0 }
                candidates: { type: integer, minimum: 0 }
                candidatesPaid: { type: integer, minimum: 0 }
                collectedCents: { type: integer, minimum: 0 }
                goalCents: { type: integer, minimum: 0 }
    BillingEvent:
      description: Examen o evento con cuota y el avance de su cobranza
      type: object
      required: [id, category, title, date, currency]
      properties:
        id: { type: string }
        category: { type: string, enum: [EXAM, EVENT] }
        title: { type: string }
        date: { type: string, format: date }
        venue: { type: [string, 'null'] }
        currency: { type: string }
        lines: { type: array, items: { $ref: '#/components/schemas/ChargeLine' } }
        amountCents: { type: integer, minimum: 0, description: Monto por alumno (suma de `lines`) }
        examId: { type: [string, 'null'], description: Solo en exámenes }
        candidates: { type: integer, minimum: 0 }
        candidatesPaid: { type: integer, minimum: 0 }
        collectedCents: { type: integer, minimum: 0 }
        goalCents: { type: integer, minimum: 0 }
    BillingEventList:
      type: object
      required: [asOf, upcoming, past]
      properties:
        asOf: { type: string, format: date-time }
        upcoming: { type: array, items: { $ref: '#/components/schemas/BillingEvent' } }
        past: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/BillingEvent' } }
    ChargeLine:
      type: object
      required: [label, amountCents]
      properties:
        label: { type: string, maxLength: 80 }
        amountCents: { type: integer, minimum: 1 }
    CreateBillingEventRequest:
      type: object
      required: [category, title, date, lines]
      properties:
        category: { type: string, enum: [EXAM, EVENT] }
        title: { type: string, maxLength: 120, description: Concepto de cada cargo }
        date: { type: string, format: date, description: Hoy o después; vencimiento de los cargos }
        venue: { type: [string, 'null'], maxLength: 120 }
        lines: { type: array, minItems: 1, maxItems: 10, items: { $ref: '#/components/schemas/ChargeLine' } }
        studentIds:
          type: array
          maxItems: 500
          description: Solo alumnos `ACTIVE` del dojo
          items: { type: string }
    BillingEventDetail:
      type: object
      required: [asOf, event, students]
      properties:
        asOf: { type: string, format: date-time }
        event: { $ref: '#/components/schemas/BillingEvent' }
        students:
          type: array
          description: Orden alfabético; sin los alumnos quitados
          items:
            type: object
            required: [chargeId, status, amountCents, student]
            properties:
              chargeId: { type: string }
              status: { $ref: '#/components/schemas/ChargeStatus' }
              amountCents: { type: integer, minimum: 0 }
              paidOn: { type: [string, 'null'], format: date }
              method: { description: Solo con `PAID`, oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/PaymentMethod' }] }
              student: { $ref: '#/components/schemas/ChargeStudent' }
    ChargeStudent:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string }
        displayName: { type: string }
        photoUrl: { type: [string, 'null'] }
        rank: { $ref: '#/components/schemas/StudentRank' }
    ChargesPage:
      type: object
      required: [asOf, items]
      properties:
        asOf: { type: string, format: date-time }
        nextCursor: { type: [string, 'null'] }
        items:
          type: array
          items:
            type: object
            required: [id, concept, category, amountCents, currency, status, dueOn, student]
            properties:
              id: { type: string }
              concept: { type: string }
              category: { $ref: '#/components/schemas/ChargeCategory' }
              amountCents: { type: integer, minimum: 0 }
              currency: { type: string }
              status: { $ref: '#/components/schemas/ChargeStatus' }
              dueOn: { type: string, format: date }
              paidOn: { type: [string, 'null'], format: date }
              method: { description: Solo con `PAID`, oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/PaymentMethod' }] }
              student: { $ref: '#/components/schemas/ChargeStudent' }
    ChargeDetail:
      type: object
      required: [asOf, charge, student, history]
      properties:
        asOf: { type: string, format: date-time }
        charge:
          type: object
          required: [id, concept, category, currency, status, dueOn, lines, amountCents]
          properties:
            id: { type: string }
            concept: { type: string }
            programName: { type: [string, 'null'] }
            category: { $ref: '#/components/schemas/ChargeCategory' }
            period: { type: [string, 'null'], description: '`YYYY-MM` en mensualidades' }
            currency: { type: string }
            status: { $ref: '#/components/schemas/ChargeStatus' }
            dueOn: { type: string, format: date }
            lines:
              type: array
              items:
                type: object
                required: [label, amountCents]
                properties:
                  label: { type: string }
                  amountCents: { type: integer }
            amountCents: { type: integer, minimum: 0, description: Total con recargo si aplica }
            note: { type: [string, 'null'] }
            payment:
              oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/RegisteredPayment'
        student:
          allOf:
            - $ref: '#/components/schemas/ChargeStudent'
            - type: object
              properties:
                age: { type: [integer, 'null'] }
                scheduleDescription: { type: [string, 'null'] }
                guardian:
                  oneOf:
                    - type: 'null'
                    - type: object
                      required: [name, relation]
                      properties:
                        name: { type: string }
                        relation: { type: string, enum: [FATHER, MOTHER, LEGAL_GUARDIAN] }
                        phone: { type: [string, 'null'], description: E.164 }
                contactPhone: { type: [string, 'null'], description: E.164 }
                monthlyUpToDate: { type: boolean }
                pendingCharges: { type: integer, minimum: 0 }
        history:
          type: array
          maxItems: 5
          description: Últimos pagos vigentes del alumno
          items:
            type: object
            required: [id, paidOn, concept, method, amountCents]
            properties:
              id: { type: string }
              paidOn: { type: string, format: date }
              concept: { type: string }
              method: { $ref: '#/components/schemas/PaymentMethod' }
              amountCents: { type: integer, minimum: 0 }
        receipt: { $ref: '#/components/schemas/Receipt' }
    RegisteredPayment:
      type: object
      required: [id, paidOn, method, amountCents]
      properties:
        id: { type: string }
        paidOn: { type: string, format: date }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        amountCents: { type: integer, minimum: 0 }
        lateFeeCents: { type: integer, minimum: 0, default: 0 }
        note: { type: [string, 'null'] }
    PayRequest:
      type: object
      required: [method]
      properties:
        method: { $ref: '#/components/schemas/PaymentMethod' }
        note: { type: [string, 'null'], maxLength: 200 }
    Receipt:
      description: Recibo para compartir desde el teléfono; el servidor no envía nada. `null` si no está pagado.
      oneOf:
        - type: 'null'
        - type: object
          required: [text]
          properties:
            phone: { type: [string, 'null'], description: E.164 del tutor o del alumno }
            text: { type: string }
            whatsappUrl: { type: [string, 'null'] }
            smsUrl: { type: [string, 'null'] }
    DeviceRegistration:
      type: object
      required: [fcmToken, platform, appVersion]
      properties:
        fcmToken: { type: string, description: Token de registro de FCM; nunca se escribe en logs }
        platform: { type: string, enum: [ANDROID, IOS] }
        appVersion:
          type: string
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          description: '`versionName` de la app; se compara como en `AppSettings`'
        locale: { type: string, description: 'BCP 47 (`es-MX`)', default: es-MX }
        notificationsEnabled:
          type: boolean
          default: true
          description: Permiso del sistema concedido y notificaciones de la app encendidas
      example:
        fcmToken: eXaMpLe:APA91bHkL0
        platform: ANDROID
        appVersion: 0.3.0
        locale: es-MX
        notificationsEnabled: true
    PushType:
      type: string
      enum: [MEMBERSHIP_DUE, MEMBERSHIP_OVERDUE, MEMBERSHIP_PAID, FEATURE_ANNOUNCEMENT, APP_UPDATE]
      description: >-
        Abierto: la app abre su pantalla inicial con un tipo que no conoce, así que agregar uno no es un cambio
        incompatible. Canal y momento de cada tipo en `docs/api/push-api.md §4`.
    PushData:
      type: object
      description: >-
        No es un endpoint: es el bloque `data` del mensaje FCM que envía el backend junto con `notification`
        (título y cuerpo en español, sin montos ni datos personales), `android.notification.channel_id`
        (`account`, `news` o `updates`) y `android.notification.click_action` = `dev.treecode.kensho.OPEN_PUSH`
        (obligatorio: sin él la app abierta no recibe `data`). FCM exige que todos los valores sean string.
      required: [v, id, type]
      properties:
        v: { type: string, const: '1', description: Versión de este esquema }
        id: { type: string, description: Id del envío en `notification_log`; no se muestra }
        type: { $ref: '#/components/schemas/PushType' }
        url:
          type: string
          format: uri
          description: Solo `https` de `treecode.dev`; la app ignora otro esquema o dominio
      example:
        v: '1'
        id: ntf_01JD8X2Q9M
        type: MEMBERSHIP_DUE
        url: https://treecode.dev/kensho/membresia
    Error:
      type: object
      description: >-
        La app muestra `message` tal cual (ADR-020): en español de México, para el usuario final y sin
        datos técnicos. Si falta o viene vacío, usa `tkd_error_*` según el código HTTP.
      properties:
        code: { type: string }
        message: { type: string }
        fields:
          type: array
          description: Solo en 422. Campos inválidos del request.
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string, description: Ruta del campo en el request (`contact.phone`) }
              code:
                type: string
                enum: [REQUIRED, INVALID_FORMAT, OUT_OF_RANGE, NOT_AVAILABLE, DUPLICATED]
                description: >-
                  La app lo traduce a `TkdFieldError` para elegir el texto bajo el campo; un código nuevo se
                  trata como `Invalid` ("Revisa este campo").
        ranks:
          type: array
          description: Solo en 409 `RANK_IN_USE`. Rangos con alumnos que el cuerpo quitaba.
          items:
            type: object
            required: [belt]
            properties:
              belt: { $ref: '#/components/schemas/BeltCode' }
              grade: { $ref: '#/components/schemas/BeltGrade' }
