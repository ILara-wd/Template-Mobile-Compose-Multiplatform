              required: [system, value]
              properties:
                system: { type: string, enum: [KUP, DAN, KYU] }
                value: { type: integer, minimum: 1, maximum: 20 }
        requiredClasses: { type: integer, minimum: 0, maximum: 1000, default: 0 }
        verifierName: { type: [string, 'null'], maxLength: 120 }
        requirements:
          type: array
          maxItems: 30
          items:
            type: object
            required: [id, title]
            properties:
              id: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,39}$', description: Único en el rango; conservarlo al editar }
              title: { type: string, minLength: 1, maxLength: 120 }
              description: { type: [string, 'null'], maxLength: 500 }
    ScheduleRequest:
      type: object
      required: [discipline, weekdays, startsAt, endsAt]
      properties:
        discipline: { $ref: '#/components/schemas/DisciplineCode' }
        weekdays:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items: { type: string, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY] }
        startsAt: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }
        endsAt: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', description: Mayor que `startsAt` (`OUT_OF_RANGE`) }
        description: { type: [string, 'null'], maxLength: 200 }
        capacity: { type: [integer, 'null'], minimum: 1, maximum: 1000, description: '`null` = sin límite' }
