openapi: 3.1.0
info:
  title: Kensho API
  version: 0.1.0
  description: |
    API del portal de administración del dojo (ADR-017). Las fixtures de `app/src/test/resources/fixtures/`
    salen de este contrato.

    Pase de lista, Pagos y perfil del instructor: solo los endpoints que consume la app; el resto (eventos,
    exámenes) está en su documento de `docs/api/`.

    Estado (2026-10-31): el entorno `dev` es un mock estático en Netlify que solo sirve `GET login.json`
    (ver `x-static-mock`). La app lo consume con `StaticMockTkdAuthApi` mientras `kensho.authStaticMock.debug=true`.
servers:
  - url: https://treecode.dev/api/v1/
    description: Producción (release)
  - url: https://treecode.dev/api/dev/
    description: Desarrollo (debug) — hoy mock estático
tags:
  - name: auth
    description: Inicio de sesión, alta del dojo y renovación del token
  - name: students
    description: >-
      Alumnos del dojo de la sesión (diseño en `docs/api/students-api.md`); edición de la ficha y estado en
      `docs/api/student-edit-api.md`
  - name: dojo-config
    description: >-
      Configuración del dojo que necesita la ficha de alta: programas con escalera, horarios y plan
      (`docs/api/dojo-config-api.md`). Las mutaciones devuelven el `DojoConfig` completo.
  - name: attendance
    description: Pase de lista por sesión (horario + fecha) del dojo de la sesión (`docs/api/checkin-api.md`)
  - name: payments
    description: >-
      Resumen del mes, cargos, cobro con `Idempotency-Key` y anulación (`docs/api/payments-api.md`). Montos en
      centavos con la moneda del cargo.
  - name: sensei-profile
    description: Perfil del instructor, switch "En el tatami" y sus datos (`docs/api/sensei-profile-api.md`)
  - name: app
    description: >-
      Configuración de la app que el splash pide antes del login: versiones por plataforma, mantenimiento, textos de
      los avisos y banderas. Público (sin token).
  - name: push
    description: >-
      Registro del dispositivo para notificaciones push con FCM (ADR-027, `docs/api/push-api.md`). El contenido de
      cada notificación (`PushData`) no es un endpoint: lo envía el backend por FCM.
security:
  - bearerAuth: []
paths:
  /app/settings:
    get:
      tags: [app]
      operationId: appSettings
      summary: Políticas de versión, mantenimiento y banderas de la app
      description: >-
        Público: el splash lo pide antes del login. Si falla, la app sigue con la última respuesta guardada sin el
        mantenimiento (o sin restricciones si nunca la recibió). Las versiones se comparan con `versionName`
        (`major.minor.patch`, un sufijo `-x` es anterior a la misma versión sin sufijo); `blocked` es coincidencia
        exacta. Una bandera ausente vale `false`.
      security: []
      responses:
        '200':
          description: Configuración vigente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppSettings' }
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Inicia sesión con correo y contraseña
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sesión abierta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Crea la cuenta del dojo y abre sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Cuenta creada y sesión abierta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '409':
          description: El correo ya tiene una cuenta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Renueva el access token
      description: >-
        La app lo llama una sola vez ante un 401. Rota el refresh token (el anterior queda revocado). Solo un 401
        de este endpoint cierra la sesión local; un fallo de red o un 5xx la conserva y la petición original
        falla con el error transitorio.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Tokens nuevos (el refresh token puede rotar)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me:
    get:
      tags: [auth]
      operationId: me
      summary: Cuenta del usuario dueño del token
      responses:
        '200':
          description: Cuenta del instructor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [sensei-profile]
      operationId: updateMe
      summary: Cambia cargo, año en que empezó a enseñar y rango del instructor
      description: >-
        Solo cambian las llaves enviadas; `null` borra el dato y `{}` no cambia nada. La app manda siempre las
        tres llaves con nulos explícitos.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeUpdate' }
      responses:
        '200':
          description: Cuenta actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Cierra solo la sesión de este dispositivo
      description: >-
        Revoca el refresh token del cuerpo. No requiere Bearer. La app borra la sesión local con cualquier
        resultado; un fallo solo significa que el token no se revocó en el servidor.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204':
          description: Sesión revocada
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout-all:
    post:
      tags: [auth]
      operationId: logoutAll
      summary: Cierra la sesión en todos los dispositivos
      description: >-
        Revoca todos los access y refresh tokens del usuario autenticado. Sin cuerpo de petición ni de respuesta.
        Con 204 o 401 la app borra la sesión local; con otro error la conserva para reintentar.
      responses:
        '204':
          description: Sesiones revocadas
        '401': { $ref: '#/components/responses/Unauthorized' }
  /students:
    get:
      tags: [students]
      operationId: listStudents
      summary: Alumnos del dojo (activos por defecto) y cintas del filtro
      description: >-
        Lista completa (sin paginación): la app busca, filtra por cinta y ordena en local. El dojo sale del token.
        Códigos desconocidos de `belt` o `examStatus.code` no invalidan la lista (la app los ignora). Sin `status`
        devuelve solo los activos; con él, los estados pedidos (`docs/api/student-edit-api.md` §4).
      parameters:
        - in: query
          name: status
          required: false
          description: Repetible (`?status=PAUSED&status=INACTIVE`); un valor desconocido responde 422.
          schema:
            type: array
            items: { $ref: '#/components/schemas/MembershipStatus' }
          style: form
          explode: true
        - in: header
          name: If-None-Match
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Alumnos activos
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentList' }
        '304': { description: Sin cambios desde el ETag enviado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '403':
          description: Sin permiso sobre los alumnos del dojo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [students]
      operationId: createStudent
      summary: Da de alta un alumno en el dojo de la sesión
      description: >-
        Idempotente por `Idempotency-Key` (el `registrationId` del setup): un reintento con la misma llave y el mismo
        cuerpo devuelve el mismo 201. Diseño en `docs/api/student-registration-api.md`.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: El `registrationId` de `GET /dojo/registration-setup`
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStudentRequest' }
      responses:
        '201':
          description: Alumno creado (o reintento idempotente)
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /students/{studentId}:
    get:
      tags: [students]
      operationId: studentProfile
      summary: Perfil completo de un alumno del dojo de la sesión
      description: >-
        Un alumno de otro dojo responde 404. Los textos del temario, del programa y de la observación son
        contenido del dojo; los nombres de cinta y grado los arma la app a partir de los códigos
        (diseño en `docs/api/student-profile-api.md`).
      parameters:
        - in: path
          name: studentId
          required: true
          schema: { type: string }
        - in: header
          name: If-None-Match
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Perfil del alumno
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentProfile' }
        '304': { description: Sin cambios desde el ETag enviado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /students/{studentId}/record:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    get:
      tags: [students]
      operationId: studentRecord
      summary: Ficha editable del alumno
      description: >-
        Lo capturado en el alta que el perfil no devuelve (datos médicos y de contacto): `no-store`. Un alumno en pausa
        o de baja también se lee; uno de otro dojo responde 404 (`docs/api/student-edit-api.md` §2).
      responses:
        '200':
          description: Ficha del alumno
          headers:
            ETag: { description: 'Versión de la ficha (débil); va en `If-Match` al guardar', schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [students]
      operationId: updateStudentRecord
      summary: Corrige datos personales, tutor, contacto, emergencia y horario
      description: >-
        Solo cambian las llaves presentes y `null` borra los opcionales; `{}` responde 200 sin cambios. Disciplina,
        rango, primera clase y estado no se aceptan (422 `NOT_EDITABLE`). Un menor sin tutor responde 422 en
        `guardian.name`; nombre y fecha repetidos, 409 `STUDENT_ALREADY_EXISTS`; una baja, 409 `STUDENT_INACTIVE`
        (`docs/api/student-edit-api.md` §3).
      parameters:
        - in: header
          name: If-Match
          required: false
          description: El `ETag` de `GET record`; si no coincide responde 412. Sin él gana el último en guardar.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentRecordPatch' }
            example:
              contact: { phone: '+525511112222', email: null }
              scheduleId: karate-tue-thu-1830
      responses:
        '200':
          description: Ficha actualizada
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentRecord' }
        '400': { description: El cuerpo no es un objeto JSON }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412':
          description: La ficha cambió desde que se leyó (`PRECONDITION_FAILED`); recargar y volver a aplicar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /students/{studentId}/membership:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    put:
      tags: [students]
      operationId: setStudentMembership
      summary: Pausa, da de baja o reactiva al alumno
      description: >-
        Idempotente: el estado actual responde 200 sin cambiar fecha ni motivo. Reactivar necesita cupo en su horario
        o un `scheduleId` con cupo (409 `SCHEDULE_FULL`; 422 `scheduleId` `NOT_AVAILABLE` o `REQUIRED`). La baja
        cancela sus cargos pendientes de exámenes y eventos; la pausa, solo con `cancelUpcomingEvents`
        (`docs/api/student-edit-api.md` §4).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MembershipRequest' }
            example: { status: PAUSED, reason: Lesión de rodilla, cancelUpcomingEvents: false }
      responses:
        '200':
          description: Ficha con el estado nuevo y los cargos cancelados
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipResponse' }
        '400': { description: El cuerpo no es un objeto JSON }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Reactivar sin cupo en su horario (`SCHEDULE_FULL`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /dojo/registration-setup:
    get:
      tags: [students]
      operationId: registrationSetup
      summary: Catálogos para dar de alta un alumno y folio reservado
      description: >-
        Cada llamada reserva un `registrationId` (vigencia 7 días) que el alta usa como `Idempotency-Key`.
        Los nombres de cinta, grado y días los arma la app a partir de los códigos.
      responses:
        '200':
          description: Catálogos del dojo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationSetup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /dojo/config:
    get:
      tags: [dojo-config]
      operationId: dojoConfig
      summary: Configuración completa del dojo
      description: >-
        La app decide con ella si el dojo ya puede dar de alta alumnos: al menos un programa con rangos y un
        horario (`docs/android-integration-guide.md` §3).
      responses:
        '200':
          description: 'Configuración del dojo (`cache-control: no-store`)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DojoConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /dojo/programs/{discipline}:
    parameters:
      - name: discipline
        in: path
        required: true
        description: Disciplina que se entrena (`MIXED` no tiene programa); acepta mayúsculas o minúsculas
        schema: { type: string, enum: [KARATE, TAEKWONDO, BJJ] }
    put:
      tags: [dojo-config]
      operationId: saveProgram
      summary: Crea o reemplaza el programa con su escalera completa
      description: >-
        Reconcilia en lugar de borrar: un rango que sigue (misma cinta y grado) y un requisito que sigue (mismo
        `id`) conservan su fila y las verificaciones de los alumnos. Lo que no viene se borra.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgramRequest' }
      responses:
        '200':
          description: Programa reemplazado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DojoConfig' }
        '201':
          description: Programa creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DojoConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`RANK_IN_USE`: se quitaría un rango con alumnos; `ranks` dice cuáles. No cambia nada.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [dojo-config]
      operationId: deleteProgram
      summary: Borra el programa con su escalera, requisitos y horarios
      responses:
        '204':
          description: Programa borrado
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`PROGRAM_IN_USE`: el programa tiene alumnos'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /dojo/schedules/{scheduleId}:
    parameters:
      - name: scheduleId
        in: path
        required: true
        description: Slug que genera la app una sola vez (`karate-mon-wed-1730`); reintentar no duplica
        schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,39}$' }
    put:
      tags: [dojo-config]
      operationId: saveSchedule
      summary: Crea o reemplaza un horario
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleRequest' }
      responses:
        '200':
          description: Horario reemplazado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DojoConfig' }
        '201':
          description: Horario creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DojoConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: '`SCHEDULE_IN_USE`: no se puede cambiar la disciplina de un horario con alumnos'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [dojo-config]
      operationId: deleteSchedule
      summary: Borra un horario
      responses:
        '204':
          description: Horario borrado
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`SCHEDULE_IN_USE`: algún alumno lo tiene asignado'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /dojo/settings:
    put:
      tags: [dojo-config]
      operationId: saveSettings
      summary: Guarda el plan de cobro y la lada
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DojoSettings' }
      responses:
        '200':
          description: Plan guardado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DojoConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /me/profile:
    get:
      tags: [sensei-profile]
      operationId: senseiProfile
      summary: Perfil completo del instructor en una llamada
      description: >-
        Identidad, ingresos del mes (mismo cálculo que `GET /payments/summary`), la sede (una cuenta es un dojo),
        la semana de lunes a domingo de `asOf` con los mismos `id` de sesión que el pase de lista, y avisos. Leerlo
        genera las mensualidades que falten. `Cache-Control: no-store`.
      responses:
        '200':
          description: Perfil del instructor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SenseiProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/presence:
    put:
      tags: [sensei-profile]
      operationId: setPresence
      summary: Switch "En el tatami"
      description: Solo lo cambia el instructor; la app lo aplica de forma optimista y regresa si falla.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [onTatami]
              properties:
                onTatami: { type: boolean }
      responses:
        '204':
          description: Guardado
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /me/devices/{installationId}:
    parameters:
      - $ref: '#/components/parameters/InstallationId'
    put:
      tags: [push]
      operationId: registerDevice
      summary: Alta o actualización del dispositivo para push
      description: >-
        Idempotente (upsert por `installationId`): reemplaza token, versión, idioma, permiso y el usuario dueño, así
        que otra cuenta en el mismo teléfono se queda con el dispositivo. Si el `fcmToken` ya estaba en otro
        `installationId`, ese registro se borra. El usuario y su rol salen del token. La app lo llama al iniciar
        sesión, en `onNewToken`, al cambiar de versión o de permiso y una vez al día; un fallo no bloquea la UI.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceRegistration' }
      responses:
        '204':
          description: Registrado
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [push]
      operationId: unregisterDevice
      summary: Quita el dispositivo al cerrar sesión
      description: >-
        La app lo llama antes de `POST /auth/logout`, mientras aún tiene Bearer, y borra la sesión local con
        cualquier resultado. 204 también si no existía. `POST /auth/logout-all` borra todos los dispositivos del
        usuario.
      responses:
        '204':
          description: Quitado o inexistente
        '401': { $ref: '#/components/responses/Unauthorized' }
  /attendance/today:
    get:
      tags: [attendance]
      operationId: attendanceToday
      summary: Sesiones de hoy en la zona del dojo con su resumen
      responses:
        '200':
          description: Día del pase de lista
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceDay' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /attendance/sessions/{scheduleId}/{date}:
    parameters:
      - $ref: '#/components/parameters/ScheduleId'
      - $ref: '#/components/parameters/SessionDate'
    get:
      tags: [attendance]
      operationId: attendanceSession
      summary: Roster de una sesión
      responses:
        '200':
          description: Sesión con sus alumnos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceRoster' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '`SESSION_NOT_FOUND`: el horario no existe, es de otro dojo o no cae en esa fecha'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /attendance/sessions/{scheduleId}/{date}/students/{studentId}:
    parameters:
      - $ref: '#/components/parameters/ScheduleId'
      - $ref: '#/components/parameters/SessionDate'
      - name: studentId
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [attendance]
      operationId: markAttendance
      summary: Marca (o deshace con `PENDING`) la asistencia de un alumno
      description: >-
        Idempotente: reenviar el mismo estado no cambia `checkedInAt`. Se puede marcar hoy y hasta 30 días atrás.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttendanceMarkRequest' }
      responses:
        '200':
          description: Alumno marcado y resumen actualizado
          content:
            application/json:
              schema:
                type: object
                required: [student, summary]
                properties:
                  student: { $ref: '#/components/schemas/Attendee' }
                  summary: { $ref: '#/components/schemas/AttendanceSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '`SESSION_NOT_FOUND` o `STUDENT_NOT_IN_SESSION`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`SESSION_NOT_STARTED` (fecha futura) o `SESSION_LOCKED` (más de 30 días)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /attendance/sessions/{scheduleId}/{date}/close:
    parameters:
      - $ref: '#/components/parameters/ScheduleId'
      - $ref: '#/components/parameters/SessionDate'
    post:
      tags: [attendance]
      operationId: closeAttendance
      summary: Completa el pase de lista; los no marcados quedan ausentes
      description: Sin cuerpo. Repetirlo conserva el primer cierre.
      responses:
        '200':
          description: Sesión cerrada (`status` = `CLOSED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceRoster' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '`SESSION_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`SESSION_NOT_STARTED` o `SESSION_LOCKED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /payments/summary:
    get:
      tags: [payments]
      operationId: paymentsSummary
      summary: Flujo de caja del mes y el próximo evento con cuota
      description: Genera las mensualidades que falten antes de calcular.
      parameters:
        - name: month
          in: query
          required: false
          description: '`YYYY-MM`; sin él, el mes de `asOf` en la zona del dojo'
          schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
      responses:
        '200':
          description: Resumen del mes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentsSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /payments/charges:
    get:
      tags: [payments]
      operationId: listCharges
      summary: Cargos con filtros, más recientes primero
      parameters:
        - name: category
          in: query
          description: Se puede repetir
          schema: { type: array, items: { $ref: '#/components/schemas/ChargeCategory' } }
          style: form
          explode: true
        - name: status
          in: query
          description: Se puede repetir; sin `status` se listan todos menos `CANCELED`
          schema: { type: array, items: { $ref: '#/components/schemas/ChargeStatus' } }
          style: form
          explode: true
        - name: studentId
          in: query
          schema: { type: string }
        - name: cursor
          in: query
          description: '`nextCursor` de la página anterior (opaco)'
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Página de cargos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChargesPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /payments/charges/{chargeId}:
    parameters:
      - $ref: '#/components/parameters/ChargeId'
    get:
      tags: [payments]
      operationId: chargeDetail
      summary: Detalle del cargo con el alumno, su historial y el recibo si está pagado
      responses:
        '200':
          description: Detalle del cargo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChargeDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '`CHARGE_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /payments/charges/{chargeId}/payments:
    parameters:
      - $ref: '#/components/parameters/ChargeId'
    post:
      tags: [payments]
      operationId: payCharge
      summary: Registra el cobro de un cargo
      description: >-
        Un reintento con la misma `Idempotency-Key` y el mismo cuerpo devuelve el mismo pago. Con recargo, el
        monto cobrado lo calcula el servidor.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID que la app conserva entre reintentos del mismo cobro
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayRequest' }
      responses:
        '201':
          description: Cobro registrado
          content:
            application/json:
              schema:
                type: object
                required: [payment]
                properties:
                  payment: { $ref: '#/components/schemas/RegisteredPayment' }
                  receipt: { $ref: '#/components/schemas/Receipt' }
        '400':
          description: '`BAD_REQUEST`: falta `Idempotency-Key`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '`CHARGE_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`CHARGE_ALREADY_PAID`, `CHARGE_CANCELED` o `IDEMPOTENCY_KEY_REUSED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /payments/charges/{chargeId}/payments/{paymentId}:
    parameters:
      - $ref: '#/components/parameters/ChargeId'
      - name: paymentId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [payments]
      operationId: voidPayment
      summary: Anula un cobro; el cargo vuelve a pendiente o vencido
      description: Repetirlo también responde 200.
      responses:
        '200':
          description: Detalle del cargo sin el pago
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChargeDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '`CHARGE_NOT_FOUND` o `PAYMENT_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /payments/events:
    get:
      tags: [payments]
      operationId: listBillingEvents
      summary: Exámenes y eventos con cuota, próximos y pasados
      responses:
        '200':
          description: Los de hoy en adelante (el más próximo primero) y los 20 pasados más recientes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingEventList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [payments]
      operationId: createBillingEvent
      summary: Crea un examen o evento con cuota y un cargo por alumno
      description: >-
        Un examen también crea la fila de `exams` y la fija como `nextExam` de sus alumnos (reemplaza la que tuvieran).
        Los cargos vencen en `date` y no llevan recargo. Por ahora no se puede editar ni borrar
        (`docs/api/payments-api.md` §3.6).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBillingEventRequest' }
            example:
              category: EXAM
              title: Examen de grado a cinta azul
              date: '2026-11-28'
              venue: Tatami Central
              lines:
                - { label: Tasa de evaluación y sinodales, amountCents: 3500 }
                - { label: Cinta nueva bordada y certificado, amountCents: 1000 }
              studentIds: [st-kenji-sato, st-maya-rodriguez]
      responses:
        '201':
          description: Evento creado con sus alumnos
          headers:
            Location:
              description: '`/api/v1/payments/events/{eventId}`'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingEventDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: >-
            `VALIDATION_FAILED`; un alumno que no está activo o es de otro dojo se marca
            `{ field: 'studentIds[i]', code: NOT_AVAILABLE }`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /payments/events/{eventId}:
    parameters:
      - name: eventId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [payments]
      operationId: billingEventDetail
      summary: Detalle del evento con el cargo de cada alumno
      responses:
        '200':
          description: Detalle del evento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingEventDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '`EVENT_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /payments/events/{eventId}/students/{studentId}:
    parameters:
      - name: eventId
        in: path
        required: true
        schema: { type: string }
      - name: studentId
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [payments]
      operationId: addBillingEventStudent
      summary: Agrega al alumno al evento
      description: Crea su cargo o reactiva el que se había cancelado. Es idempotente; sin cuerpo.
      responses:
        '200':
          description: Detalle del evento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingEventDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '`EVENT_NOT_FOUND` o `STUDENT_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`STUDENT_NOT_ACTIVE`: el alumno está pausado o de baja'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [payments]
      operationId: removeBillingEventStudent
      summary: Quita al alumno del evento
      description: >-
        Su cargo pasa a `CANCELED` (queda en el historial) y, si es examen, deja de ser su próximo examen. Repetirlo
        responde 200.
      responses:
        '200':
          description: Detalle del evento sin el alumno
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingEventDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '`EVENT_NOT_FOUND` o `STUDENT_NOT_IN_EVENT`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`CHARGE_ALREADY_PAID`: primero se anula el pago'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
x-static-mock:
  description: Respuesta del mock estático de Netlify (`GET {dev}/login.json`). No valida credenciales ni emite token.
  path: /login.json
  example:
    status: 200
    data:
      userId: 647
      userMail: mock@treecode.dev
      userInfo: true
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    StudentId:
      in: path
      name: studentId
      required: true
      schema: { type: string }
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      schema: { type: string }
    SessionDate:
      name: date
      in: path
      required: true
      description: Fecha de la sesión en la zona del dojo
      schema: { type: string, format: date }
    ChargeId:
      name: chargeId
      in: path
      required: true
      schema: { type: string }
    InstallationId:
      name: installationId
      in: path
      required: true
      description: UUID v4 que la app genera una vez por instalación; sobrevive al cierre de sesión
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Credenciales o token inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Recurso inexistente o fuera del dojo de la sesión
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Ya existe un recurso con esos datos o la llave de idempotencia se usó con otro cuerpo
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Gone:
      description: El folio de registro venció
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: Campos inválidos; `fields` dice cuáles
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    AppSettings:
      type: object
      required: [app_version_policy]
      properties:
        app_version_policy:
          type: object
          properties:
            ios: { $ref: '#/components/schemas/PlatformVersionPolicy' }
            android: { $ref: '#/components/schemas/PlatformVersionPolicy' }
            force_update: { $ref: '#/components/schemas/AppNotice' }
            maintenance:
              allOf:
                - $ref: '#/components/schemas/AppNotice'
                - type: object
                  required: [enabled]
                  properties:
                    enabled: { type: boolean, description: '`true` bloquea la app con este aviso' }
            update_catalog_version:
              type: object
              properties:
                vr: { type: string, description: Versión de los catálogos (la app aún no la usa) }
            flags:
              type: array
              items:
                type: object
                required: [name]
                properties:
                  name: { type: string }
                  FTI: { type: boolean, description: Encendida en iOS }
                  FTA: { type: boolean, description: Encendida en Android }
      example:
        app_version_policy:
          ios: { min_supported: '0.1.0', recommended: '0.1.0', blocked: [] }
          android: { min_supported: '0.1.0', recommended: '0.2.0', blocked: ['0.0.3'] }
          force_update:
            title: Actualiza Kensho
            body: Esta versión ya no es compatible. Descarga la más reciente para seguir usando la app.
            actionLabel: Actualizar
          maintenance:
            enabled: false
            title: Estamos en mantenimiento
            body: Volvemos en unos minutos. Inténtalo de nuevo más tarde.
            actionLabel: Entendido
          update_catalog_version: { vr: '0.0.23' }
          flags:
            - { name: ff_01, FTI: true, FTA: true }
    PlatformVersionPolicy:
      type: object
      properties:
        min_supported: { type: string, description: Menor versión que puede abrir la app }
        recommended: { type: string, description: Con una menor se sugiere actualizar (se puede cerrar) }
        blocked:
          type: array
          items: { type: string }
          description: Versiones que no pueden abrir la app aunque cumplan el mínimo
    AppNotice:
      type: object
      description: Textos del aviso; si falta alguno la app usa el suyo
      properties:
        title: { type: string }
        body: { type: string }
        actionLabel: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    RegisterRequest:
      type: object
      required: [instructorName, dojoName, discipline, email, password]
      properties:
        instructorName: { type: string }
        dojoName: { type: string }
        discipline: { $ref: '#/components/schemas/DisciplineCode' }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    Session:
      type: object
      required: [accessToken, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: [string, 'null'] }
        expiresIn: { type: integer, description: Segundos de vigencia del access token }
        user: { $ref: '#/components/schemas/User' }
      example:
        accessToken: access-1
        refreshToken: refresh-1
        expiresIn: 3600
        user: { id: u-1, email: sensei@kenshodojo.com, instructorName: Kenji Sato }
    User:
      type: object
      required: [id, email]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        instructorName: { type: string }
    Me:
      type: object
      required: [id, email, instructorName, dojoName, discipline]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        instructorName: { type: string }
        dojoName: { type: string }
        discipline: { $ref: '#/components/schemas/DisciplineCode' }
        title: { type: [string, 'null'], maxLength: 60, description: Cargo libre del instructor }
        rank: { $ref: '#/components/schemas/InstructorRank' }
        teachingSince: { type: [integer, 'null'], minimum: 1900, description: Año en que empezó a enseñar }
        onTatami: { type: boolean, default: false }
      example:
        id: b1536619-a5b2-4199-a506-0b72fe2269c4
        email: qa.kensho.1793509763@example.com
        instructorName: QA Kensho
        dojoName: Dojo QA
        discipline: TAEKWONDO
        title: Head Coach
        rank: { discipline: KARATE, belt: BLACK, grade: { system: DAN, value: 4 } }
        teachingSince: 2010
        onTatami: false
    MeUpdate:
      type: object
      description: Todas opcionales; `null` borra el dato.
      properties:
        title: { type: [string, 'null'], maxLength: 60, description: Vacío equivale a `null` }
        teachingSince: { type: [integer, 'null'], minimum: 1900, description: Hasta el año en curso }
        rank: { $ref: '#/components/schemas/InstructorRank' }
      example:
        title: Head Coach
        teachingSince: 2010
        rank: { discipline: KARATE, belt: BLACK, grade: { system: DAN, value: 4 } }
    InstructorRank:
      description: Igual que el rango de los alumnos, sin `stripes`; la cinta no tiene que estar en la escalera del dojo.
      oneOf:
        - type: 'null'
        - type: object
          required: [discipline, belt]
          properties:
            discipline: { $ref: '#/components/schemas/DisciplineCode' }
            belt: { $ref: '#/components/schemas/BeltCode' }
            grade:
              oneOf:
                - type: 'null'
                - type: object
                  required: [system, value]
                  properties:
                    system: { type: string, enum: [KUP, DAN, KYU] }
                    value: { type: integer, minimum: 1, maximum: 20 }
    DisciplineCode:
      type: string
      description: >-
        Código de catálogo. `KARATE`, `TAEKWONDO` y `BJJ` se entrenan (`DojoDiscipline`: programas, horarios,
        alumnos); `MIXED` solo es disciplina principal del registro y de `GET me` (`DojoMainDiscipline`) y la app
        la descarta en catálogos de la ficha de alta.
      enum: [KARATE, BJJ, TAEKWONDO, MIXED]
    StudentList:
      type: object
      required: [asOf, beltFilters, items]
      properties:
        asOf: { type: string, format: date-time }
        beltFilters:
          type: array
          uniqueItems: true
          description: Cintas del filtro en el orden del temario del dojo; vacío oculta la fila de chips.
          items: { $ref: '#/components/schemas/BeltCode' }
        items:
          type: array
          items: { $ref: '#/components/schemas/StudentSummary' }
      example:
        asOf: '2026-11-05T17:30:00-07:00'
        beltFilters: [WHITE, ORANGE, YELLOW, GREEN, BLUE, PURPLE, BROWN, RED, BLACK]
        items:
          - id: st-kenji-sato
            displayName: Kenji Sato
            age: 14
            photoUrl: https://cdn.treecode.dev/students/st-kenji-sato.jpg
            rank: { discipline: TAEKWONDO, belt: GREEN, grade: { system: KUP, value: 6 }, stripes: 2 }
            examStatus: { code: READY }
            attendance: { attended: 22, required: 24 }
            nextExamOn: '2026-11-28'
          - id: st-alex-chen
            displayName: Alex Chen
            age: 28
            photoUrl: null
            rank: { discipline: BJJ, belt: BLUE, grade: null, stripes: 2 }
            examStatus: { code: SPARRING_EVAL_PENDING }
            attendance: { attended: 48, required: 60 }
            nextExamOn: '2026-12-04'
          - id: st-maya-rodriguez
            displayName: Maya Rodríguez
            age: 10
            photoUrl: https://cdn.treecode.dev/students/st-maya-rodriguez.jpg
            rank: { discipline: TAEKWONDO, belt: YELLOW, grade: { system: KUP, value: 8 }, stripes: 0 }
            examStatus: { code: CLASSES_REMAINING, classesRemaining: 2 }
            attendance: { attended: 14, required: 16 }
            nextExamOn: null
    StudentSummary:
      type: object
      required: [id, displayName, age, photoUrl, rank, examStatus, attendance, nextExamOn]
      properties:
        id: { type: string }
        displayName: { type: string, minLength: 1 }
        age: { type: integer, minimum: 0 }
        photoUrl: { type: [string, 'null'], format: uri }
        rank: { $ref: '#/components/schemas/StudentRank' }
        examStatus: { $ref: '#/components/schemas/ExamStatus' }
        attendance:
          type: object
          required: [attended, required]
          properties:
            attended: { type: integer, minimum: 0 }
            required: { type: integer, minimum: 0 }
        nextExamOn: { type: [string, 'null'], format: date }
        membership:
          type: object
          description: Estado del alumno; sirve al pedir `?status=` con varios estados.
          required: [status]
          properties:
            status: { $ref: '#/components/schemas/MembershipStatus' }
    StudentRank:
      type: object
      required: [discipline, belt, grade, stripes]
      properties:
        discipline: { $ref: '#/components/schemas/DisciplineCode' }
        belt: { $ref: '#/components/schemas/BeltCode' }
        grade: { $ref: '#/components/schemas/BeltGrade' }
        stripes: { type: integer, minimum: 0 }
    ExamStatus:
      type: object
      required: [code]
      properties:
        code: { type: string, enum: [READY, CLASSES_REMAINING, SPARRING_EVAL_PENDING, READY_FOR_BLACK_TIP] }
        classesRemaining: { type: integer, minimum: 1, description: Solo con CLASSES_REMAINING }
    BeltCode:
      type: string
      enum: [WHITE, ORANGE, YELLOW, GREEN, BLUE, PURPLE, BROWN, RED, BLACK]
    BeltGrade:
      oneOf:
        - type: 'null'
        - type: object
          required: [system, value]
          properties:
            system: { type: string, enum: [KUP, DAN, KYU] }
            value: { type: integer, minimum: 1 }
    StudentProfile:
      type: object
      required: [asOf, id, displayName, age, photoUrl, membership, program, rank, nextRank, nextExam,
                 attendance, syllabus, latestObservation, graduation]
      properties:
        asOf: { type: string, format: date-time }
        id: { type: string }
        displayName: { type: string, minLength: 1 }
        age: { type: integer, minimum: 0 }
        photoUrl: { type: [string, 'null'], format: uri }
        membership:
          type: object
          required: [status, enrolledOn]
          properties:
            status: { $ref: '#/components/schemas/MembershipStatus' }
